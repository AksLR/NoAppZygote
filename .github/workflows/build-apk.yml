name: Build LSPosed APK

on:
  push:
    branches:
      - '**'
    paths:
      - 'LSPosed/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'LSPosed/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        working-directory: LSPosed
        run: chmod +x ./gradlew && ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NoAppZygote-LSPosed-debug-apk
          path: LSPosed/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NoAppZygote-LSPosed-release-apk
          path: LSPosed/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
